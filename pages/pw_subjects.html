<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <link rel="shortcut icon" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subjects — GB STUDY</title>
    <meta name="description" content="View batch subjects, faculty information, and study resources on GB STUDY.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#2563eb">
    <link rel="canonical" href="https://eduzex.pages.dev/subjects.html">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pw-blue: #2563eb;
            --pw-light-blue: #eff6ff;
            --pw-blue-border: #bfdbfe;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-body: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --gradient-1: linear-gradient(135deg, #dbeafe, #bfdbfe);
        }
        
        html { scroll-behavior: smooth; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; -webkit-font-smoothing: antialiased; }
        
        .header { 
            position: sticky; top: 0; z-index: 50; background: #fff; 
            padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
        }
        .header-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .back-btn { background: none; border: none; cursor: pointer; color: var(--text-main); display: flex; align-items: center; justify-content: center; padding-right: 4px; }
        .batch-title { font-size: 17px; font-weight: 700; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        

        .container { max-width: 1200px; margin: 0 auto; padding-top: 16px; padding-bottom: 40px; }
        
        /* Search Bar with Swipe Animation */
        .search-container-wrapper { padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--border-color); }
        .search-container {
            display: flex; align-items: center; padding: 10px 16px; background: #fff; 
            border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; position: relative; overflow: hidden;
            max-width: 1200px; margin: 0 auto;
        }
        .search-container svg { width: 18px; height: 18px; color: #94a3b8; margin-right: 12px; }
        .search-text-wrapper { height: 20px; overflow: hidden; position: relative; flex: 1; }
        .search-text-slider {
            display: flex; flex-direction: column; position: absolute; left: 0; top: 0;
            animation: slideUp 6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
        .search-text-slider span { height: 20px; line-height: 20px; font-size: 15px; color: #94a3b8; font-weight: 500; }
        
        @keyframes slideUp {
            0%, 25% { transform: translateY(0); }
            33%, 58% { transform: translateY(-20px); }
            66%, 91% { transform: translateY(-40px); }
            100% { transform: translateY(-60px); }
        }

        /* Tabs */
        .tabs-nav {
            display: flex; padding: 0 16px; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 56px; background: #fff; z-index: 40;
        }
        .tab-btn {
            background: none; border: none; padding: 14px 16px 14px 4px; margin-right: 16px; font-size: 15px; font-weight: 600;
            color: var(--text-muted); cursor: pointer; position: relative;
        }
        .tab-btn.active { color: #2563eb; font-weight: 700; }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px;
            background: #2563eb; border-radius: 2px 2px 0 0;
        }

        .completion-banner {
            background: #fef3c7; color: #92400e; font-size: 13px; font-weight: 500;
            padding: 10px 16px; text-align: center; margin-bottom: 16px;
        }

        .subjects-list {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; padding: 0 16px;
        }
        
        .subject-card {
            border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 16px;
            display: flex; gap: 16px; align-items: center; background: #ffffff; cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            max-width: 480px;
        }

        @media (min-width: 640px) {
            .subject-card {
                width: calc(50% - 8px);
                max-width: none;
            }
        }

        @media (min-width: 1024px) {
            .subject-card {
                width: calc(33.333% - 11px);
            }
        }
        .subject-card:active { transform: scale(0.99); background: #f8fafc; }
        
        .subject-icon-box {
            width: 48px; height: 48px; border-radius: 8px; background: #f1f5f9;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            overflow: hidden; padding: 6px;
        }
        .subject-icon-box img { width: 100%; height: 100%; object-fit: contain; }
        .subject-icon-text { font-size: 18px; font-weight: 700; color: #3b82f6; }
        
        .subject-content { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .subject-title { font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .subject-meta {
            font-size: 12px; color: #475569; font-weight: 600; display: flex; align-items: center; gap: 6px;
        }
        .subject-meta-divider { width: 1.5px; height: 10px; background: #cbd5e1; }
        
        .arrow-icon { color: #94a3b8; }

        .loader { width: 32px; height: 32px; border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 40px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

<style>
  img[src*="1790916890122.png"], img[src*="eduzex.png"], .pw-header-logo, .footer-pw-logo, .brand img {
    border-radius: 50% !important;
    object-fit: cover !important;
  }
</style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <div class="batch-title">All Classes</div>
        </div>
    </div>
    
    <div class="search-container-wrapper">
        <div class="search-container" onclick="openSearch()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <div class="search-text-wrapper">
                <div class="search-text-slider">
                    <span>Search for Lectures</span>
                    <span>Search for DPPs</span>
                    <span>Search for Notes</span>
                    <span>Search for Lectures</span>
                </div>
            </div>
        </div>
    </div>

    <div class="container" id="mainContainer">
        

        
        <div id="tabContent">
            <div id="subjectsList" class="subjects-list">
                <div class="loader"></div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        function sanitizeId(val) {
            if (!val || typeof val !== 'string') return null;
            const t = val.trim();
            if (!t || t === 'null' || t === 'undefined' || t === '[object Object]') return null;
            return t;
        }

        const rawBatchId = sanitizeId(urlParams.get('batch_id')) ||
                           sanitizeId(urlParams.get('batchid')) ||
                           sanitizeId(urlParams.get('batchId')) ||
                           sanitizeId(urlParams.get('id')) ||
                           sanitizeId(localStorage.getItem('active_batch_id')) ||
                           '698ad3519549b300a5e1cc6a';

        const batchId = rawBatchId;
        const passedBatchName = urlParams.get('name') || urlParams.get('batch_name') || urlParams.get('title') || urlParams.get('tittle');

        if (passedBatchName) {
            const el = document.querySelector('.batch-title');
            if (el) el.textContent = passedBatchName;
            document.title = passedBatchName;
        }

        let batchDetails = null;
        let teacherMap = {};

        function openSearch() {
            window.location.href = '/pw/search?batch_id=' + batchId;
        }

        function switchTab(tabId, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(event && event.target) {
                event.target.classList.add('active');
            }
            
            if (tabId === 'subjects') {
                renderSubjects();
            } else {
                document.getElementById('tabContent').innerHTML = `
                    <div style="padding: 40px 16px; text-align: center; color: #64748b;">
                        <p style="font-weight: 500;">Resources Coming Soon</p>
                    </div>
                `;
            }
        }

        async function loadData() {
            if (!batchId) {
                document.getElementById('mainContainer').innerHTML = '<p style="text-align:center; padding: 40px;">No batch ID provided.</p>';
                return;
            }
            
            try {
                const detailsRes = await fetch(`/api/pw/radha/v3/batches/${batchId}/details`);
                const detailsText = detailsRes && detailsRes.ok ? await detailsRes.text().catch(() => '') : '';
                const detailsData = detailsText ? JSON.parse(detailsText) : null;
                batchDetails = detailsData?.data || {};
                
                if (batchDetails.name) {
                    const el = document.querySelector('.batch-title');
                    if (el) el.textContent = batchDetails.name;
                    document.title = batchDetails.name;
                }

                if (batchDetails.subjects) {
                    batchDetails.subjects.forEach(sub => {
                        if (sub.teacherIds) {
                            sub.teacherIds.forEach(t => {
                                if (t._id && t.imageId && t.imageId.baseUrl && t.imageId.key) {
                                    teacherMap[t._id] = t.imageId.baseUrl + t.imageId.key;
                                }
                            });
                        }
                    });
                }
                
                renderSubjects();
                
            } catch (err) {
                console.error(err);
                document.getElementById('mainContainer').innerHTML = '<p style="text-align:center; padding: 40px;">Error loading batch details.</p>';
            }
        }

        function renderSubjects() {
            const container = document.getElementById('tabContent');
            if (!batchDetails || !batchDetails.subjects || batchDetails.subjects.length === 0) {
                container.innerHTML = `
                    <div style="padding: 40px 16px; text-align: center; color: #64748b;">
                        <p style="font-weight: 500;">No subjects found.</p>
                    </div>
                `;
                return;
            }
            
            let html = '<div class="subjects-list">';
            batchDetails.subjects.forEach(sub => {
                let iconUrl = ''; 
                let subjectInitial = sub.subject ? sub.subject.substring(0, 2).charAt(0).toUpperCase() + sub.subject.substring(1, 2).toLowerCase() : 'Su';
                
                if (sub.subject && sub.subject.toLowerCase() === 'notices') {
                    iconUrl = 'https://cdn-icons-png.flaticon.com/128/9079/9079237.png';
                } else if (sub.imageId && sub.imageId.baseUrl && sub.imageId.key) {
                    iconUrl = sub.imageId.baseUrl + sub.imageId.key;
                }
                
                let iconHtml = '';
                if (iconUrl) {
                    iconHtml = `<img src="${iconUrl}" alt="Icon">`;
                } else {
                    iconHtml = `<span class="subject-icon-text">${subjectInitial}</span>`;
                }
                
                let teacherName = '';
                if (sub.teacherIds && sub.teacherIds.length > 0) {
                    const t = sub.teacherIds[0];
                    teacherName = `${t.firstName || ''} ${t.lastName || ''}`.trim();
                }
                
                let subjectDisplay = sub.subject;
                if (!iconUrl && teacherName) {
                    // subjectDisplay += ` By ${teacherName}`;
                }
                    
                const lectureCount = sub.lectureCount || 0;
                const chaptersCount = sub.tagCount || 0;
                const targetUrl = `/pw/topics?batch_id=${batchId}&subject_id=${sub._id}&name=${encodeURIComponent(sub.subject)}`;
                
                html += `
                    <div class="subject-card" onclick="window.location.href='${targetUrl}'">
                        <div class="subject-icon-box" style="${!iconUrl ? 'background: #eff6ff;' : ''}">
                            ${iconHtml}
                        </div>
                        <div class="subject-content">
                            <div class="subject-title">${escapeHtml(subjectDisplay)}</div>
                            <div class="subject-meta">
                                <span>${lectureCount} Lectures</span>
                                <span class="subject-meta-divider"></span>
                                <span>${chaptersCount} Chapters</span>
                            </div>
                        </div>
                        <div class="arrow-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        loadData();
    </script>
</body>
</html>
