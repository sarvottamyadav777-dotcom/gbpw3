<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <link rel="shortcut icon" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search Study Content — GB STUDY</title>
    <meta name="description" content="Search across lectures, exercises, DPPs, and notes on GB STUDY.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#2563eb">
    <link rel="canonical" href="https://eduzex.pages.dev/pw_search.html">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pw-blue: #2563eb;
            --pw-light-blue: #eff6ff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-body: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --active-tab-bg: #334155;
            --active-tab-text: #ffffff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            background: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
            position: relative; z-index: 10; border-bottom: 1px solid var(--border-color);
        }
        .header-title { font-size: 17px; font-weight: 700; color: #1e293b; }
        .close-btn { background: none; border: none; cursor: pointer; color: var(--text-main); padding: 4px; display: flex; align-items: center; justify-content: center; }
        
        .search-area {
            padding: 16px;
            background: #fff;
            position: relative;
            z-index: 10;
        }
        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            pointer-events: none;
        }
        .clear-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 2px;
            display: none;
            z-index: 5;
        }
        
        .search-input {
            width: 100%;
            padding: 14px 40px 14px 44px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-size: 15px;
            color: #1e293b;
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus { border-color: var(--pw-blue); background: #fff; box-shadow: 0 0 0 3px var(--pw-light-blue); }
        .search-input::placeholder { color: transparent; } /* Hidden, we use animated placeholder */
        
        /* Animated Placeholder Overlay */
        .animated-placeholder {
            position: absolute;
            left: 44px;
            top: 50%;
            transform: translateY(-50%);
            height: 20px;
            overflow: hidden;
            pointer-events: none;
            display: flex;
        }
        .animated-placeholder-slider {
            display: flex;
            flex-direction: column;
            animation: slideUp 6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
        .animated-placeholder-slider span {
            height: 20px;
            line-height: 20px;
            font-size: 15px;
            color: #94a3b8;
            font-weight: 500;
        }
        
        @keyframes slideUp {
            0%, 25% { transform: translateY(0); }
            33%, 58% { transform: translateY(-20px); }
            66%, 91% { transform: translateY(-40px); }
            100% { transform: translateY(-60px); }
        }
        
        .search-input:focus + .animated-placeholder,
        .search-input:not(:placeholder-shown) + .animated-placeholder {
            display: none;
        }
        
        .tabs-container {
            padding: 0 16px 16px;
            background: #fff;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            border-bottom: 1px solid var(--border-color);
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            background: #ffffff; border: 1px solid var(--border-color); 
            padding: 8px 16px; font-size: 14px; font-weight: 500;
            color: var(--text-muted); cursor: pointer; border-radius: 20px; white-space: nowrap;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--active-tab-bg); 
            color: var(--active-tab-text); 
            border-color: var(--active-tab-bg); 
            font-weight: 600;
        }
        
        .results-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f8fafc;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: #94a3b8;
            padding: 40px 20px;
        }
        .empty-icon { width: 140px; height: auto; margin-bottom: 24px; opacity: 0.8; }
        .empty-title { font-size: 16px; font-weight: 600; color: #64748b; }
        
        /* Loading Shimmer */
        .shimmer {
            height: 140px;
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Search Result Card mimicking pw_content.html */
        .content-card {
            border: 1px solid var(--border-color); border-radius: 16px; padding: 16px;
            background: #ffffff; display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            margin-bottom: 16px;
        }
        
        .card-top { display: flex; gap: 16px; }
        
        .icon-box {
            width: 56px; height: 56px; border-radius: 12px; background: var(--pw-light-blue);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            position: relative;
        }
        
        .icon-box-inner {
            width: 36px; height: 36px; border-radius: 50%; background: var(--pw-blue);
            display: flex; align-items: center; justify-content: center; color: #fff;
        }
        
        .icon-box-inner svg { width: 20px; height: 20px; }
        
        .small-badge {
            position: absolute; bottom: -2px; right: -2px; width: 20px; height: 20px;
            background: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .small-badge-inner {
            width: 16px; height: 16px; background: var(--pw-blue); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #fff;
        }
        
        .card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .card-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
        .card-title { font-size: 15px; font-weight: 600; color: #1e293b; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .card-divider { height: 1px; background: #f1f5f9; margin: 0 -16px; }
        
        .card-action {
            width: 100%; padding: 12px; border-radius: 8px; background: #f8fafc;
            border: none; color: #1e293b; font-size: 14px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer; transition: background 0.2s;
        }
        .card-action:hover { background: #f1f5f9; }

        @media (min-width: 768px) {
            .results-container { max-width: 800px; margin: 0 auto; width: 100%; padding: 24px; }
        }
    </style>

<style>
  img[src*="1790916890122.png"], img[src*="eduzex.png"], .pw-header-logo, .footer-pw-logo, .brand img {
    border-radius: 50% !important;
    object-fit: cover !important;
  }
</style>
</head>
<body>
    <div class="header">
        <h1 class="header-title">Search</h1>
        <button class="close-btn" onclick="history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>
    
    <div class="search-area">
        <div class="search-input-wrapper">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" class="search-input" id="searchInput" placeholder=" " autocomplete="off">
            <div class="animated-placeholder" id="animatedPlaceholder">
                <div class="animated-placeholder-slider">
                    <span>Search for Lectures</span>
                    <span>Search for DPPs</span>
                    <span>Search for Notes</span>
                    <span>Search for Lectures</span>
                </div>
            </div>
            <button class="clear-btn" id="clearBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
    </div>
    
    <div class="tabs-container" id="tabsContainer">
        <button class="tab-btn active" data-type="LECTURES">Lectures</button>
        <button class="tab-btn" data-type="DPP_PDF">DPPs</button>
        <button class="tab-btn" data-type="NOTES">Notes</button>
        <button class="tab-btn" data-type="DPP_VIDEOS">Dpp Videos</button>
    </div>
    
    <div class="results-container" id="resultsContainer">
        <div class="empty-state">
            <svg class="empty-icon" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M70 45 L90 25 H160 C165.5 25 170 29.5 170 35 V125 C170 130.5 165.5 135 160 135 H40 C34.5 135 30 130.5 30 125 V45 H70 Z" fill="#E2E8F0"/>
                <path d="M70 45 L90 25 H160 C165.5 25 170 29.5 170 35 V60 H30 V45 H70 Z" fill="#CBD5E1"/>
                <circle cx="130" cy="85" r="25" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="6"/>
                <line x1="147" y1="102" x2="165" y2="120" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
            </svg>
            <div class="empty-title">Type to search</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const batchId = urlParams.get('batch_id');
        
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const tabsContainer = document.getElementById('tabsContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const animatedPlaceholder = document.getElementById('animatedPlaceholder');
        
        let currentType = 'LECTURES';
        let currentQuery = '';
        let debounceTimer;

        searchInput.addEventListener('input', (e) => {
            currentQuery = e.target.value.trim();
            if (currentQuery.length > 0) {
                clearBtn.style.display = 'block';
                animatedPlaceholder.style.display = 'none';
            } else {
                clearBtn.style.display = 'none';
                animatedPlaceholder.style.display = 'flex';
            }
            
            clearTimeout(debounceTimer);
            if (currentQuery.length > 2) {
                debounceTimer = setTimeout(() => {
                    performSearch();
                }, 400);
            } else if (currentQuery.length === 0) {
                showEmptyState("Type to search");
            }
        });
        
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentQuery = '';
            clearBtn.style.display = 'none';
            animatedPlaceholder.style.display = 'flex';
            searchInput.focus();
            showEmptyState("Type to search");
        });
        
        tabsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab-btn')) {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentType = e.target.getAttribute('data-type');
                
                if (currentQuery.length > 2) {
                    performSearch();
                }
            }
        });
        
        function showEmptyState(msg = "No Results Found") {
            resultsContainer.innerHTML = `
                <div class="empty-state">
                    <svg class="empty-icon" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M40 70 L60 50 H120 C125.5 50 130 54.5 130 60 V105 H40 V70 Z" fill="#bfdbfe" opacity="0.6"/>
                        <path d="M70 45 L90 25 H160 C165.5 25 170 29.5 170 35 V125 C170 130.5 165.5 135 160 135 H40 C34.5 135 30 130.5 30 125 V45 H70 Z" fill="#93c5fd"/>
                        <path d="M70 45 L90 25 H160 C165.5 25 170 29.5 170 35 V60 H30 V45 H70 Z" fill="#60a5fa"/>
                        <circle cx="120" cy="85" r="20" fill="#fff" stroke="#3b82f6" stroke-width="4"/>
                        <line x1="135" y1="100" x2="150" y2="115" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
                        <path d="M70 80 H90 M70 95 H100 M70 110 H85" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <div class="empty-title">${msg}</div>
                </div>
            `;
        }
        
        async function performSearch() {
            if (!batchId) return;
            
            resultsContainer.innerHTML = '<div class="shimmer"></div><div class="shimmer"></div>';
            
            try {
                const apiUrl = `/api/pw/radha/batch-service/v3/batch-subject-schedules/${batchId}/study-content/search?query=${encodeURIComponent(currentQuery)}&page=1&limit=15&type=${currentType}`;
                
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("Search failed");
                const text = await response.text().catch(() => '');
                const data = text ? JSON.parse(text) : {};
                
                const results = data.data || [];
                
                if (results.length === 0) {
                    showEmptyState("No Results Found");
                    return;
                }
                
                let html = '<div>';
                results.forEach(item => {
                    const title = item.title || item.topic || item.name || "Untitled Resource";
                    let meta = "";
                    if (item.date) {
                        const d = new Date(item.date);
                        meta += d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + " • ";
                    }
                    if (item.faculty && item.faculty.length > 0) {
                        meta += item.faculty.map(f => `${f.firstName || ''} ${f.lastName || ''}`).join(', ');
                    } else if (item.subject) {
                        meta += item.subject;
                    }
                    if (meta.endsWith(" • ")) meta = meta.slice(0, -3);
                    
                    let iconSvg = '';
                    let badgeSvg = '';
                    let actionBtnHtml = '';
                    let typeLabel = '';
                    let actionUrl = '#';

                    if (currentType === 'LECTURES' || currentType === 'DPP_VIDEOS') {
                        typeLabel = currentType === 'LECTURES' ? 'Lecture' : 'Video';
                        iconSvg = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
                        badgeSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;
                        actionUrl = `/pw/live?batch_id=${batchId}&name=${encodeURIComponent(title)}`;
                        actionBtnHtml = `<button class="card-action" onclick="window.location.href='${actionUrl}'"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> Watch Now</button>`;
                    } else {
                        typeLabel = currentType === 'NOTES' ? 'Notes' : 'PDF';
                        iconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>`;
                        badgeSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`;
                        
                        let pdfUrl = '';
                        if (item.attachmentIds && item.attachmentIds.length > 0) {
                            const att = item.attachmentIds[0];
                            pdfUrl = (att.baseUrl || '') + (att.key || '');
                        }
                        
                        if (typeLabel.includes('DPP') || typeLabel.includes('Notes') || typeLabel.includes('Test')) {
                            const fallbackPdfUrl = '/api/pw/shyam?batch_id=' + batchId + '&subject_id=' + (item.batchSubjectId || '') + '&Id=' + (item.scheduleId || item._id || '') + '&type=pdf';
                            actionBtnHtml = `<button class="card-action" onclick="window.open('${fallbackPdfUrl}', '_blank')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> View ${typeLabel}</button>`;
                        }
                    }

                    html += `
                        <div class="content-card">
                            <div class="card-top">
                                <div class="icon-box">
                                    <div class="icon-box-inner">
                                        ${iconSvg}
                                    </div>
                                    <div class="small-badge">
                                        <div class="small-badge-inner">
                                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                                ${badgeSvg.split('viewBox="0 0 24 24"')[1] || ''}
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-info">
                                    <div class="card-meta">${typeLabel} • ${meta}</div>
                                    <div class="card-title">${escapeHtml(title)}</div>
                                </div>
                            </div>
                            <div class="card-divider"></div>
                            ${actionBtnHtml}
                        </div>
                    `;
                });
                html += '</div>';
                resultsContainer.innerHTML = html;
                
            } catch (err) {
                console.error(err);
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:64px;height:64px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <div class="empty-title">Error searching contents.</div>
                        <div style="font-size:14px; margin-top:8px;">Please try again later.</div>
                    </div>
                `;
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
