<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <link rel="shortcut icon" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Community — GB STUDY</title>
    <meta name="description" content="Connect with fellow learners, participate in discussions, and share doubts on GB STUDY Community.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#2563eb">
    <link rel="canonical" href="https://eduzex.pages.dev/community.html">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --pw-primary: #5a4bda;
            --pw-primary-hover: #4a3bca;
            --pw-primary-light: #eef2ff;
            --pw-secondary: #059669;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .header {
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .header-top {
            max-width: 800px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .back-btn {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s;
        }

        .back-btn:hover {
            background: #e2e8f0;
            color: var(--pw-primary);
        }

        .batch-info {
            min-width: 0;
        }

        .batch-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .batch-badge {
            font-size: 11px;
            font-weight: 700;
            background: #e0e7ff;
            color: var(--pw-primary);
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .batch-sub {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Nav Tabs Bar (Only Students Feed & Teachers Feed) */
        .tabs-bar-container {
            background: #ffffff;
            border-top: 1px solid var(--border-light);
        }

        .tabs-bar {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            padding: 0 16px;
        }

        .nav-tab {
            flex: 1;
            padding: 14px 16px;
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-muted);
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            color: var(--text-main);
        }

        .nav-tab.active {
            color: var(--pw-primary);
            border-bottom-color: var(--pw-primary);
        }

        .nav-tab .tab-badge {
            font-size: 11px;
            font-weight: 700;
            background: #f1f5f9;
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .nav-tab.active .tab-badge {
            background: var(--pw-primary-light);
            color: var(--pw-primary);
        }

        /* Main Content Container */
        .main-container {
            max-width: 800px;
            margin: 16px auto;
            padding: 0 16px 60px;
            width: 100%;
            flex: 1;
        }

        /* Create Post Card with PW Official Logo */
        .create-post-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }

        .create-post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .pw-official-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .create-post-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            resize: vertical;
            min-height: 64px;
            transition: border-color 0.15s;
            background: #fcfdfe;
        }

        .create-post-input:focus {
            border-color: var(--pw-primary);
            background: #ffffff;
        }

        .image-preview-bar {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }

        .preview-thumb {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
        }

        .create-post-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
            flex-wrap: wrap;
            gap: 8px;
        }

        .attach-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.15s;
        }

        .attach-btn:hover {
            background: #f1f5f9;
            color: var(--pw-primary);
        }

        .post-submit-btn {
            background: var(--pw-primary);
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 8px 22px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s, transform 0.1s;
        }

        .post-submit-btn:hover {
            background: var(--pw-primary-hover);
        }

        .post-submit-btn:active {
            transform: scale(0.98);
        }

        /* Post Card */
        .post-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s;
        }

        .post-card:hover {
            box-shadow: var(--shadow-md);
        }

        .post-card.pinned {
            border-left: 4px solid var(--pw-primary);
            background: linear-gradient(to right, #fcfdff, #ffffff);
        }

        .post-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .post-author-box {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .author-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: #f8fafc;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .author-meta {
            min-width: 0;
        }

        .author-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .author-name {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-main);
        }

        .badge-role {
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-pw-verified {
            background: #eef2ff;
            color: var(--pw-primary);
            border: 1px solid #c7d2fe;
        }

        .badge-teacher {
            background: #fef3c7;
            color: #d97706;
            border: 1px solid #fde68a;
        }

        .badge-student {
            background: #f1f5f9;
            color: #64748b;
        }

        .badge-pinned {
            background: #e0e7ff;
            color: var(--pw-primary);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
        }

        .post-time {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 2px;
        }

        .post-content {
            font-size: 15px;
            line-height: 1.65;
            color: #1e293b;
            margin-bottom: 14px;
            word-break: break-word;
        }

        .post-content p {
            margin-bottom: 8px;
        }

        .post-content p:last-child {
            margin-bottom: 0;
        }

        .post-content a {
            color: var(--pw-primary);
            text-decoration: underline;
            word-break: break-all;
        }

        /* Media Attachments */
        .attachments-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 14px;
            border-radius: 10px;
            overflow: hidden;
        }

        .attachments-grid.single {
            grid-template-columns: 1fr;
        }

        .attachments-grid.multi {
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .post-attachment-img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }

        .post-attachment-img:hover {
            opacity: 0.95;
            transform: scale(1.005);
        }

        /* Post Actions & Reactions */
        .post-actions-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
            flex-wrap: wrap;
            gap: 10px;
        }

        .reactions-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .reaction-btn {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 5px 11px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
            user-select: none;
        }

        .reaction-btn:hover {
            background: #f1f5f9;
            transform: scale(1.05);
        }

        .reaction-btn.active {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: var(--pw-primary);
        }

        .post-action-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-link {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 6px;
            transition: all 0.15s;
        }

        .action-link:hover {
            color: var(--pw-primary);
            background: #f1f5f9;
        }

        /* Expandable Comments */
        .comments-drawer {
            display: none;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed var(--border-color);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        .comment-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
        }

        .comment-author {
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }

        .comment-text {
            color: var(--text-muted);
            line-height: 1.4;
        }

        .comment-input-row {
            display: flex;
            gap: 8px;
        }

        .comment-input {
            flex: 1;
            padding: 9px 14px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 13px;
            outline: none;
        }

        .comment-send-btn {
            background: var(--pw-primary);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Infinite Scroll & Loader States */
        .infinite-scroll-loader {
            display: none;
            text-align: center;
            padding: 24px 16px;
            color: var(--pw-primary);
            font-weight: 600;
            font-size: 14px;
        }

        .infinite-scroll-loader.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .end-of-feed-msg {
            display: none;
            text-align: center;
            padding: 30px 16px;
            color: var(--text-light);
            font-size: 13px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }

        .empty-state i {
            font-size: 48px;
            color: #cbd5e1;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 420px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 12px;
            color: var(--pw-primary);
            font-weight: 600;
            font-size: 14px;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(90, 75, 218, 0.15);
            border-top-color: var(--pw-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Lightbox */
        .lightbox-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.92);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .lightbox-img {
            max-width: 95vw;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .lightbox-close:hover {
            background: rgba(255,255,255,0.4);
        }

        /* Toast */
        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13.5px;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s;
            opacity: 0;
            pointer-events: none;
        }

        .toast-msg.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 640px) {
            .header-top { padding: 10px 12px; }
            .tabs-bar { padding: 0 8px; }
            .nav-tab { padding: 12px 10px; font-size: 13.5px; }
            .main-container { padding: 0 12px 30px; }
            .post-card { padding: 14px 16px; }
            .post-content { font-size: 14px; }
        }
    </style>

<style>
  img[src*="1790916890122.png"], img[src*="eduzex.png"], .pw-header-logo, .footer-pw-logo, .brand img {
    border-radius: 50% !important;
    object-fit: cover !important;
  }
</style>
</head>
<body>

    <!-- Header Section (Clean: Back Button + Title + Live Badge) -->
    <header class="header">
        <div class="header-top">
            <div class="header-left">
                <button class="back-btn" id="btnBack" title="Go Back">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="batch-info">
                    <div class="batch-title">
                        <span id="displayBatchName">Community</span>
                        <span class="batch-badge">Live</span>
                    </div>
                    <div class="batch-sub" id="displayBatchSubtitle">Batch Discussions</div>
                </div>
            </div>
        </div>

        <!-- Two Tabs Only: Students Feed & Teachers Feed -->
        <div class="tabs-bar-container">
            <div class="tabs-bar">
                <button class="nav-tab active" id="tabStudent" onclick="switchTab('student')">
                    <i class="fa-regular fa-comments"></i>
                    <span>Students Feed</span>
                    <span class="tab-badge" id="badgeStudentCount">0</span>
                </button>
                <button class="nav-tab" id="tabTeacher" onclick="switchTab('teacher')">
                    <i class="fa-solid fa-chalkboard-user"></i>
                    <span>Teachers Feed</span>
                    <span class="tab-badge" id="badgeTeacherCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-container">

        <!-- Create Post Card (Visible for Student Feed with Official PW Logo) -->
        <div class="create-post-card" id="createPostCard">
            <div class="create-post-header">
                <img src="https://static.pw.live/5b09189f7285894d9130ccd0/ab22d604-b10e-434e-af7c-1879fd7535d2.png" class="pw-official-avatar" alt="PhysicsWallah Official">
                <textarea class="create-post-input" id="postInputText" placeholder="Write a post or share an update with your batch..."></textarea>
            </div>
            <div class="image-preview-bar" id="imagePreviewBar">
                <img src="" id="previewImg" class="preview-thumb" alt="Attached">
                <span id="previewName" style="font-size: 12px; color: var(--text-muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
                <button onclick="clearAttachedImage()" style="background:none; border:none; color:#ef4444; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="create-post-footer">
                <div style="display: flex; gap: 8px;">
                    <label class="attach-btn" style="cursor: pointer;">
                        <i class="fa-regular fa-image" style="color: #059669;"></i>
                        <span>Attach Photo</span>
                        <input type="file" id="postImageFileInput" accept="image/*" style="display: none;" onchange="handleImageAttach(this)">
                    </label>
                    <button class="attach-btn" onclick="promptImageUrl()">
                        <i class="fa-solid fa-link" style="color: #3b82f6;"></i>
                        <span>Image URL</span>
                    </button>
                </div>
                <button class="post-submit-btn" onclick="submitNewPost()">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Publish Post</span>
                </button>
            </div>
        </div>

        <!-- Posts List -->
        <div id="feedList">
            <div class="loader-container">
                <div class="spinner"></div>
                <span>Loading batch community...</span>
            </div>
        </div>

        <!-- Infinite Scroll Bottom Loader -->
        <div class="infinite-scroll-loader" id="scrollLoader">
            <div class="spinner"></div>
            <span>Loading more posts...</span>
        </div>

        <!-- End of Feed Message -->
        <div class="end-of-feed-msg" id="endOfFeedMsg">
            <i class="fa-solid fa-circle-check" style="color: #10b981; margin-right: 6px;"></i>
            You have caught up with all posts
        </div>

        <!-- Scroll Sentinel for IntersectionObserver -->
        <div id="scrollSentinel" style="height: 20px; margin-top: 10px;"></div>

    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
        <img src="" id="lightboxImg" class="lightbox-img" alt="Zoomed view">
    </div>

    <!-- Toast Notification -->
    <div class="toast-msg" id="toastMsg">
        <i class="fa-solid fa-circle-check" id="toastIcon"></i>
        <span id="toastText">Action completed</span>
    </div>

    <script>
        // Global State & Parameters
        const urlParams = new URLSearchParams(window.location.search);
        
        const requestedBatchId = urlParams.get('batchid') || urlParams.get('batchId') || urlParams.get('batch_id') || localStorage.getItem('active_batch_id') || '698ad3519549b300a5e1cc6a';
        let currentBatchId = requestedBatchId;
        
        let rawBatchName = urlParams.get('name') || urlParams.get('batchName') || localStorage.getItem('active_batch_name') || 'Arjuna JEE 2027';
        let formattedBatchName = rawBatchName;
        if (formattedBatchName.toLowerCase() === 'arjunajee2027') {
            formattedBatchName = 'Arjuna JEE 2027';
        }

        let currentTab = urlParams.get('tab') === 'teacher' ? 'teacher' : 'student';
        let studentChannelId = null;
        let teacherChannelId = null;

        // Pagination State
        const PAGE_LIMIT = 20;
        let studentPosts = [];
        let studentPage = 1;
        let studentHasMore = true;
        let studentLoading = false;

        let teacherPosts = [];
        let teacherPage = 1;
        let teacherHasMore = true;
        let teacherLoading = false;

        let localCreatedPosts = [];
        let attachedImageUrl = '';

        const PW_LOGO_URL = 'https://static.pw.live/5b09189f7285894d9130ccd0/ab22d604-b10e-434e-af7c-1879fd7535d2.png';
        const FALLBACK_STUDENT_CHANNEL = '69c56ee45601f65e1e0b28b8';
        const FALLBACK_TEACHER_CHANNEL = '699d632fbe16024df299bc3f';

        // Initialization
        window.addEventListener('DOMContentLoaded', async () => {
            setupHeader();
            loadLocalSavedPosts();

            setActiveTabUI(currentTab);

            // Fetch Channels first
            await fetchBatchChannels();

            // Load initial posts
            loadInitialTabData();

            // Setup Infinite Scroll listener
            setupInfiniteScroll();
        });

        function setupHeader() {
            document.getElementById('displayBatchName').textContent = formattedBatchName;
            document.getElementById('displayBatchSubtitle').textContent = `Batch ID: ${currentBatchId.slice(-8)}`;

            document.getElementById('btnBack').addEventListener('click', () => {
                if (document.referrer && document.referrer.includes(window.location.host)) {
                    history.back();
                } else {
                    window.location.href = `/pw/study?batch_id=${currentBatchId}`;
                }
            });
        }

        function loadLocalSavedPosts() {
            try {
                const stored = localStorage.getItem(`pw_community_posts_${currentBatchId}`);
                if (stored) {
                    localCreatedPosts = JSON.parse(stored);
                }
            } catch (e) {
                console.warn("Could not load local community posts:", e);
            }
        }

        function saveLocalCreatedPost(post) {
            try {
                localCreatedPosts.unshift(post);
                localStorage.setItem(`pw_community_posts_${currentBatchId}`, JSON.stringify(localCreatedPosts));
            } catch (e) {
                console.warn("Could not save post:", e);
            }
        }

        // Fetch Community Channels for this Batch
        async function fetchBatchChannels() {
            try {
                const res = await fetch(`/api/pw/radha/v3/community/channels/batch/${currentBatchId}`);
                if (res.ok) {
                    const text = await res.text().catch(() => '');
                    const json = text ? JSON.parse(text) : {};
                    if (json.success && Array.isArray(json.data) && json.data.length > 0) {
                        json.data.forEach(ch => {
                            const type = String(ch.type || '').toLowerCase();
                            const name = String(ch.name || '').toLowerCase();
                            if (type === 'forum' || name.includes('student') || name.includes('discussion')) {
                                studentChannelId = ch._id;
                            } else if (type === 'feed' || name.includes('teacher') || name.includes('faculty')) {
                                teacherChannelId = ch._id;
                            }
                        });
                        if (!studentChannelId && json.data[0]) studentChannelId = json.data[0]._id;
                        if (!teacherChannelId && json.data[1]) teacherChannelId = json.data[1]._id;
                    }
                }
            } catch (err) {
                console.warn("Channels API fallback triggered:", err);
            }

            if (!studentChannelId) studentChannelId = FALLBACK_STUDENT_CHANNEL;
            if (!teacherChannelId) teacherChannelId = FALLBACK_TEACHER_CHANNEL;
        }

        // Tab Switching
        function switchTab(tab) {
            if (currentTab === tab) return;
            currentTab = tab;
            setActiveTabUI(tab);
            
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('tab', tab);
            history.replaceState({}, '', newUrl);

            loadInitialTabData();
        }

        function setActiveTabUI(tab) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            if (tab === 'student') document.getElementById('tabStudent').classList.add('active');
            else if (tab === 'teacher') document.getElementById('tabTeacher').classList.add('active');

            // Show create post card only on Student Feed
            const createCard = document.getElementById('createPostCard');
            if (createCard) {
                createCard.style.display = (tab === 'student') ? 'block' : 'none';
            }

            // Hide bottom indicators on tab change
            document.getElementById('scrollLoader').classList.remove('active');
            document.getElementById('endOfFeedMsg').style.display = 'none';
        }

        // Load initial data for current tab
        async function loadInitialTabData() {
            const listEl = document.getElementById('feedList');

            if (currentTab === 'student') {
                if (studentPosts.length === 0) {
                    listEl.innerHTML = `<div class="loader-container"><div class="spinner"></div><span>Loading Student Discussions...</span></div>`;
                    studentPage = 1;
                    studentHasMore = true;
                    await fetchPostsPage('student', 1);
                } else {
                    renderPosts('student');
                }
            } else {
                if (teacherPosts.length === 0) {
                    listEl.innerHTML = `<div class="loader-container"><div class="spinner"></div><span>Loading Teachers Feed...</span></div>`;
                    teacherPage = 1;
                    teacherHasMore = true;
                    await fetchPostsPage('teacher', 1);
                } else {
                    renderPosts('teacher');
                }
            }
        }

        // Fetch a specific page of posts
        async function fetchPostsPage(tab, page) {
            if (tab === 'student') {
                if (studentLoading) return;
                studentLoading = true;
            } else {
                if (teacherLoading) return;
                teacherLoading = true;
            }

            const chId = (tab === 'student') 
                ? (studentChannelId || FALLBACK_STUDENT_CHANNEL) 
                : (teacherChannelId || FALLBACK_TEACHER_CHANNEL);

            try {
                const res = await fetch(`/api/pw/radha/v3/community/posts/v2?channelId=${chId}&page=${page}&limit=${PAGE_LIMIT}`);
                if (res.ok) {
                    const text = await res.text().catch(() => '');
                    const json = text ? JSON.parse(text) : {};
                    if (json.success && json.data && Array.isArray(json.data.posts)) {
                        const newPosts = json.data.posts;
                        if (tab === 'student') {
                            if (page === 1) {
                                studentPosts = newPosts;
                            } else {
                                // Filter out duplicate IDs
                                const existingIds = new Set(studentPosts.map(p => p._id));
                                const unique = newPosts.filter(p => !existingIds.has(p._id));
                                studentPosts = studentPosts.concat(unique);
                            }
                            if (newPosts.length < PAGE_LIMIT) studentHasMore = false;
                            document.getElementById('badgeStudentCount').textContent = studentPosts.length + localCreatedPosts.length;
                        } else {
                            if (page === 1) {
                                teacherPosts = newPosts;
                            } else {
                                const existingIds = new Set(teacherPosts.map(p => p._id));
                                const unique = newPosts.filter(p => !existingIds.has(p._id));
                                teacherPosts = teacherPosts.concat(unique);
                            }
                            if (newPosts.length < PAGE_LIMIT) teacherHasMore = false;
                            document.getElementById('badgeTeacherCount').textContent = teacherPosts.length;
                        }
                    } else {
                        if (tab === 'student') studentHasMore = false;
                        else teacherHasMore = false;
                    }
                }
            } catch (err) {
                console.error(`Error loading ${tab} posts page ${page}:`, err);
            } finally {
                if (tab === 'student') studentLoading = false;
                else teacherLoading = false;
            }

            renderPosts(tab);
            updateScrollStates();
        }

        function renderPosts(tab) {
            const listEl = document.getElementById('feedList');
            const posts = (tab === 'student') 
                ? [...localCreatedPosts, ...studentPosts] 
                : teacherPosts;

            if (posts.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <i class="${tab === 'student' ? 'fa-regular fa-comments' : 'fa-solid fa-chalkboard-user'}"></i>
                        <h3>${tab === 'student' ? 'No Student Discussions Yet' : 'No Teacher Updates Yet'}</h3>
                        <p>${tab === 'student' ? 'Be the first to share an update or question in this batch!' : 'Faculty updates and announcements will appear here.'}</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = posts.map(p => buildPostCardHTML(p, tab)).join('');
        }

        // Infinite Scroll Setup: Trigger fetch on scroll
        function setupInfiniteScroll() {
            let scrollTimeout = null;

            window.addEventListener('scroll', () => {
                if (scrollTimeout) return;
                scrollTimeout = setTimeout(() => {
                    scrollTimeout = null;
                    checkAndTriggerNextPage();
                }, 150);
            }, { passive: true });

            // IntersectionObserver on sentinel
            const sentinel = document.getElementById('scrollSentinel');
            if (window.IntersectionObserver && sentinel) {
                const observer = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting) {
                        checkAndTriggerNextPage();
                    }
                }, { rootMargin: '400px' });
                observer.observe(sentinel);
            }
        }

        function checkAndTriggerNextPage() {
            const scrollBottom = window.innerHeight + window.scrollY;
            const threshold = document.documentElement.scrollHeight - 600;

            if (scrollBottom >= threshold) {
                if (currentTab === 'student' && studentHasMore && !studentLoading) {
                    studentPage++;
                    document.getElementById('scrollLoader').classList.add('active');
                    fetchPostsPage('student', studentPage);
                } else if (currentTab === 'teacher' && teacherHasMore && !teacherLoading) {
                    teacherPage++;
                    document.getElementById('scrollLoader').classList.add('active');
                    fetchPostsPage('teacher', teacherPage);
                }
            }
        }

        function updateScrollStates() {
            const loader = document.getElementById('scrollLoader');
            const endMsg = document.getElementById('endOfFeedMsg');

            const hasMore = (currentTab === 'student') ? studentHasMore : teacherHasMore;
            const isLoading = (currentTab === 'student') ? studentLoading : teacherLoading;

            if (isLoading) {
                loader.classList.add('active');
                endMsg.style.display = 'none';
            } else {
                loader.classList.remove('active');
                if (!hasMore) {
                    const totalPosts = (currentTab === 'student') 
                        ? (studentPosts.length + localCreatedPosts.length) 
                        : teacherPosts.length;
                    if (totalPosts > 5) {
                        endMsg.style.display = 'block';
                    }
                }
            }
        }

        // Card Generator
        function buildPostCardHTML(post, tabType) {
            const author = post.user || {};
            const isSelfCreated = post._id && post._id.startsWith('local_');
            
            // If post was created by us, display PW official avatar & badge
            const authorName = isSelfCreated 
                ? 'PhysicsWallah' 
                : escapeHTML(author.name || 'Student');
                
            const avatarUrl = isSelfCreated 
                ? PW_LOGO_URL 
                : (author.profileImage || PW_LOGO_URL);
            
            const isFaculty = tabType === 'teacher' || isSelfCreated || (author.roles && (author.roles.includes('moderator') || author.roles.includes('teacher') || author.roles.includes('admin')));
            
            const roleBadge = isSelfCreated 
                ? `<span class="badge-role badge-pw-verified"><i class="fa-solid fa-certificate"></i> PW Official</span>`
                : (isFaculty 
                    ? `<span class="badge-role badge-teacher"><i class="fa-solid fa-certificate"></i> Faculty</span>` 
                    : `<span class="badge-role badge-student">Student</span>`);

            const isPinned = !!post.pinned;
            const timeAgo = formatTime(post.createdAt);
            const decodedContent = safeDecode(post.description);

            // Images attachment
            let attachHtml = '';
            if (Array.isArray(post.attachmentUrls) && post.attachmentUrls.length > 0) {
                const isSingle = post.attachmentUrls.length === 1;
                attachHtml = `<div class="attachments-grid ${isSingle ? 'single' : 'multi'}">` + 
                    post.attachmentUrls.map(att => {
                        return `<img src="${att.url}" class="post-attachment-img" onclick="openLightbox('${att.url}')" alt="Post attachment" loading="lazy">`;
                    }).join('') + 
                `</div>`;
            }

            const reactions = post.reactions || { heart: 0, like: 0, fire: 0, laugh: 0, smile: 0 };
            const commentsCount = post.total_comments || 0;
            const postId = post._id;

            return `
                <div class="post-card ${isPinned ? 'pinned' : ''}" id="post_${postId}">
                    <div class="post-header">
                        <div class="post-author-box">
                            <img src="${avatarUrl}" class="author-avatar" alt="${authorName}" onerror="this.src='${PW_LOGO_URL}'">
                            <div class="author-meta">
                                <div class="author-name-row">
                                    <span class="author-name">${authorName}</span>
                                    ${roleBadge}
                                    ${isPinned ? '<span class="badge-pinned"><i class="fa-solid fa-thumbtack"></i> Pinned</span>' : ''}
                                </div>
                                <div class="post-time">${timeAgo}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="post-content">${decodedContent}</div>
                    ${attachHtml}

                    <div class="post-actions-bar">
                        <div class="reactions-group">
                            <button class="reaction-btn" onclick="toggleReaction('${postId}', 'like', this)">
                                <span>👍</span>
                                <span class="rx-count">${reactions.like || 0}</span>
                            </button>
                            <button class="reaction-btn" onclick="toggleReaction('${postId}', 'heart', this)">
                                <span>❤️</span>
                                <span class="rx-count">${reactions.heart || 0}</span>
                            </button>
                            <button class="reaction-btn" onclick="toggleReaction('${postId}', 'fire', this)">
                                <span>🔥</span>
                                <span class="rx-count">${reactions.fire || 0}</span>
                            </button>
                            <button class="reaction-btn" onclick="toggleReaction('${postId}', 'laugh', this)">
                                <span>😂</span>
                                <span class="rx-count">${reactions.laugh || 0}</span>
                            </button>
                        </div>
                        <div class="post-action-right">
                            <button class="action-link" onclick="toggleCommentsDrawer('${postId}')">
                                <i class="fa-regular fa-comment-dots"></i>
                                <span>${commentsCount} Comments</span>
                            </button>
                            <button class="action-link" onclick="sharePost('${postId}')" title="Share post">
                                <i class="fa-solid fa-share-nodes"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Expandable Comments Drawer -->
                    <div class="comments-drawer" id="comments_${postId}">
                        <div class="comments-list" id="commentList_${postId}">
                            <div class="comment-item">
                                <div class="comment-author">
                                    <span>Peer Student</span>
                                    <span style="font-size: 11px; color: var(--text-light);">Recent</span>
                                </div>
                                <div class="comment-text">Keep working hard, great discussion! 🔥</div>
                            </div>
                        </div>
                        <div class="comment-input-row">
                            <input type="text" class="comment-input" id="inputComment_${postId}" placeholder="Write a reply..." onkeydown="if(event.key==='Enter') submitComment('${postId}')">
                            <button class="comment-send-btn" onclick="submitComment('${postId}')">
                                <i class="fa-solid fa-paper-plane" style="font-size: 12px;"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Reaction Handler
        function toggleReaction(postId, rxType, btn) {
            const countSpan = btn.querySelector('.rx-count');
            let current = parseInt(countSpan.textContent || '0', 10);
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                countSpan.textContent = Math.max(0, current - 1);
            } else {
                btn.classList.add('active');
                countSpan.textContent = current + 1;
                btn.style.transform = 'scale(1.2)';
                setTimeout(() => btn.style.transform = '', 200);
            }
        }

        // Comments Drawer Toggle
        function toggleCommentsDrawer(postId) {
            const drawer = document.getElementById(`comments_${postId}`);
            if (!drawer) return;
            const isShown = drawer.style.display === 'block';
            drawer.style.display = isShown ? 'none' : 'block';
            if (!isShown) {
                const input = document.getElementById(`inputComment_${postId}`);
                if (input) input.focus();
            }
        }

        function submitComment(postId) {
            const input = document.getElementById(`inputComment_${postId}`);
            const text = input ? input.value.trim() : '';
            if (!text) return;

            const list = document.getElementById(`commentList_${postId}`);
            if (list) {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `
                    <div class="comment-author">
                        <span>PhysicsWallah</span>
                        <span style="font-size: 11px; color: var(--text-light);">Just now</span>
                    </div>
                    <div class="comment-text">${escapeHTML(text)}</div>
                `;
                list.appendChild(item);
            }
            input.value = '';
            showToast("Reply posted!", "success");
        }

        // Create New Post Handler: Saves with PW Official Logo
        function handleImageAttach(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    attachedImageUrl = e.target.result;
                    document.getElementById('previewImg').src = attachedImageUrl;
                    document.getElementById('previewName').textContent = file.name;
                    document.getElementById('imagePreviewBar').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function promptImageUrl() {
            const url = prompt("Paste direct image URL (jpg, png, webp):");
            if (url && url.trim().startsWith('http')) {
                attachedImageUrl = url.trim();
                document.getElementById('previewImg').src = attachedImageUrl;
                document.getElementById('previewName').textContent = "Linked Image";
                document.getElementById('imagePreviewBar').style.display = 'flex';
            }
        }

        function clearAttachedImage() {
            attachedImageUrl = '';
            document.getElementById('imagePreviewBar').style.display = 'none';
            document.getElementById('previewImg').src = '';
            document.getElementById('postImageFileInput').value = '';
        }

        function submitNewPost() {
            const textarea = document.getElementById('postInputText');
            const text = textarea.value.trim();

            if (!text && !attachedImageUrl) {
                showToast("Please enter text or attach an image", "error");
                textarea.focus();
                return;
            }

            // PW Official Post Structure
            const newPost = {
                _id: 'local_' + Date.now(),
                user_id: 'user_pw_official',
                description: encodeURIComponent(`<p>${escapeHTML(text)}</p>`),
                attachmentUrls: attachedImageUrl ? [{ type: 'images', url: attachedImageUrl }] : [],
                reactions: { heart: 2, smile: 1, laugh: 0, like: 3, fire: 4 },
                total_comments: 0,
                createdAt: new Date().toISOString(),
                pinned: false,
                user: {
                    _id: 'user_pw_official',
                    name: 'PhysicsWallah',
                    profileImage: PW_LOGO_URL,
                    roles: ['admin', 'moderator']
                }
            };

            saveLocalCreatedPost(newPost);
            textarea.value = '';
            clearAttachedImage();
            renderPosts('student');
            showToast("Post published with PhysicsWallah badge!", "success");
        }

        function sharePost(postId) {
            const shareUrl = `${window.location.origin}/community?batchid=${currentBatchId}&tab=${currentTab}#post_${postId}`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast("Link copied to clipboard!", "success");
                });
            } else {
                showToast("Link ready", "info");
            }
        }

        // Lightbox Zoom
        function openLightbox(url) {
            const modal = document.getElementById('lightboxModal');
            const img = document.getElementById('lightboxImg');
            img.src = url;
            modal.style.display = 'flex';
        }

        function closeLightbox(e) {
            if (e.target.id === 'lightboxModal' || e.target.classList.contains('lightbox-close')) {
                document.getElementById('lightboxModal').style.display = 'none';
            }
        }

        // Toast Helper
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toastMsg');
            const icon = document.getElementById('toastIcon');
            const text = document.getElementById('toastText');

            text.textContent = msg;
            if (type === 'error') {
                icon.className = 'fa-solid fa-circle-exclamation';
                icon.style.color = '#ef4444';
            } else if (type === 'info') {
                icon.className = 'fa-solid fa-circle-info';
                icon.style.color = '#3b82f6';
            } else {
                icon.className = 'fa-solid fa-circle-check';
                icon.style.color = '#10b981';
            }

            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Utilities
        function safeDecode(str) {
            if (!str) return '';
            try {
                let decoded = decodeURIComponent(str);
                if (decoded.includes('%3C') || decoded.includes('%20')) {
                    try { decoded = decodeURIComponent(decoded); } catch (e) {}
                }
                return sanitizeHTML(decoded);
            } catch (e) {
                return escapeHTML(str);
            }
        }

        function sanitizeHTML(html) {
            return html
                .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
                .replace(/on\w+="[^"]*"/gi, '')
                .replace(/javascript:/gi, '');
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatTime(isoStr) {
            if (!isoStr) return '';
            try {
                const date = new Date(isoStr);
                const now = new Date();
                const diffMs = now - date;
                const diffSec = Math.floor(diffMs / 1000);
                const diffMin = Math.floor(diffSec / 60);
                const diffHour = Math.floor(diffMin / 60);
                const diffDay = Math.floor(diffHour / 24);

                if (diffMin < 1) return 'Just now';
                if (diffMin < 60) return `${diffMin}m ago`;
                if (diffHour < 24) return `${diffHour}h ago`;
                if (diffDay < 7) return `${diffDay}d ago`;
                return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            } catch (e) {
                return '';
            }
        }
    </script>
</body>
