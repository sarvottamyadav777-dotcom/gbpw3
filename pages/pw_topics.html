<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <link rel="shortcut icon" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Topics — GB STUDY</title>
    <meta name="description" content="Explore chapters, topics, lectures, notes, and exercises on GB STUDY.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#2563eb">
    <link rel="canonical" href="https://eduzex.pages.dev/pw_topics.html">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pw-blue: #2563eb;
            --pw-light-blue: #eff6ff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --accent-purple: #8b5cf6;
        }
        
        html { scroll-behavior: smooth; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: var(--card-bg); color: var(--text-main); line-height: 1.5; -webkit-font-smoothing: antialiased; }
        
        .header { 
            position: sticky; top: 0; z-index: 50; background: #fff; 
            padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }
        .header-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .back-btn { background: none; border: none; cursor: pointer; color: var(--text-main); display: flex; align-items: center; justify-content: center; padding-right: 4px; }
        .page-title { font-size: 17px; font-weight: 700; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        
        /* Tabs */
        .tabs-nav {
            display: flex; padding: 0 16px; border-bottom: 1px solid var(--border-color);
            position: sticky; top: 52px; background: #fff; z-index: 40;
            overflow-x: auto; scrollbar-width: none;
        }
        .tabs-nav::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: none; border: none; padding: 14px 16px; font-size: 15px; font-weight: 600;
            color: var(--text-muted); cursor: pointer; position: relative; text-align: center; white-space: nowrap;
        }
        .tab-btn.active { color: var(--accent-purple); font-weight: 700; }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px;
            background: var(--accent-purple); border-radius: 2px 2px 0 0;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 16px; padding-bottom: 40px; }
        
        .topics-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
        
        .topic-card {
            border: 1px solid #f1f5f9; border-radius: 12px; padding: 18px 16px 18px 36px;
            background: #ffffff; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            position: relative; transition: all 0.2s;
            width: 100%;
            max-width: 480px;
        }

        @media (min-width: 640px) {
            .topic-card {
                width: calc(50% - 8px);
                max-width: none;
            }
        }

        @media (min-width: 1024px) {
            .topic-card {
                width: calc(33.333% - 11px);
            }
        }
        .topic-card:active { transform: scale(0.99); }
        .topic-card::before {
            content: ''; position: absolute; left: 16px; top: 18px; bottom: 18px;
            width: 4px; background: var(--accent-purple); border-radius: 4px;
        }
        
        .topic-title {
            font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 8px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        
        .topic-meta {
            font-size: 13px; color: #475569; font-weight: 600; display: flex; align-items: center; gap: 8px;
        }
        .topic-meta .divider { width: 1.5px; height: 12px; background: #cbd5e1; }

        .loader { width: 32px; height: 32px; border: 3px solid #f3f3f3; border-top: 3px solid var(--accent-purple); border-radius: 50%; animation: spin 1s linear infinite; margin: 40px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .empty-state { text-align: center; padding: 48px 16px; color: var(--text-muted); }
    </style>

<style>
  img[src*="1790916890122.png"], img[src*="eduzex.png"], .pw-header-logo, .footer-pw-logo, .brand img {
    border-radius: 50% !important;
    object-fit: cover !important;
  }
</style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <div class="page-title" id="pageTitle">Loading...</div>
        </div>
    </div>
    
    <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('all', event)">All</button>
        <button class="tab-btn" onclick="switchTab('chapters', event)">Chapters</button>
        <button class="tab-btn" onclick="switchTab('extra', event)">Extra Lectures</button>
        <button class="tab-btn" onclick="switchTab('study', event)">Study Material</button>
    </div>
    
    <div class="container">
        <div id="topicsContainer" class="topics-list">
            <div class="loader"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const batchId = urlParams.get('batch_id') || urlParams.get('batchid');
        const subjectId = urlParams.get('subject_id') || urlParams.get('subjectid');
        const passedTitle = urlParams.get('title') || urlParams.get('tittle');
        const passedName = urlParams.get('name');

        if (passedTitle) {
            document.getElementById('pageTitle').textContent = passedTitle;
            document.title = passedTitle;
        } else if (passedName) {
            document.getElementById('pageTitle').textContent = passedName;
            document.title = passedName;
        } else {
            document.getElementById('pageTitle').textContent = 'Topics';
            document.title = 'Topics';
        }

        let allTopics = [];
        let currentTab = 'all';

        async function fetchTopics() {
            if (!batchId || !subjectId) {
                document.getElementById('topicsContainer').innerHTML = '<p class="empty-state">Invalid parameters</p>';
                return;
            }
            try {
                const res = await fetch(`/api/pw/radha/v1/batches/${batchId}/subject/${subjectId}/topics?page=1&limit=10000000`);
                if (!res.ok) throw new Error('API Error');
                const text = await res.text().catch(() => '');
                const json = text ? JSON.parse(text) : {};
                allTopics = json.data || [];
                
                allTopics.forEach(t => {
                    t.name = t.name || t.topic || 'Untitled';
                    const nameLower = t.name.toLowerCase();
                    const isExtra = ['extra', 'bridge', 'course', 'lecture', 'parakram', 'summary', 'discussion', 'ncert', 'homework', 'revision', 'comeback'].some(kw => nameLower.includes(kw));
                    if (nameLower.includes('study material') || nameLower.includes('pdf') || (t.notes > 0 && (t.videos || 0) === 0)) {
                        t.category = 'study';
                    } else if (isExtra) {
                        t.category = 'extra';
                    } else {
                        t.category = 'chapters';
                    }
                });

                renderTopics();
            } catch (err) {
                console.error(err);
                document.getElementById('topicsContainer').innerHTML = '<p class="empty-state">Error loading topics.</p>';
            }
        }

        function switchTab(tab, event) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(event && event.target) {
                event.target.classList.add('active');
            }
            renderTopics();
        }

        function renderTopics() {
            const container = document.getElementById('topicsContainer');
            
            let filtered = allTopics;
            if (currentTab !== 'all') {
                filtered = allTopics.filter(t => t.category === currentTab);
            }
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state">No topics found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach(topic => {
                const targetUrl = `/pw/content?batch_id=${batchId}&subject_id=${subjectId}&topic_id=${topic._id}&name=${encodeURIComponent(topic.name)}`;
                
                let vCount = topic.videos || 0;
                let eCount = topic.exercises || 0;
                let nCount = topic.notes || 0;

                html += `
                    <div class="topic-card" onclick="window.location.href='${targetUrl}'">
                        <div class="topic-title">${escapeHtml(topic.name)}</div>
                        <div class="topic-meta">
                            <span>${vCount} Videos</span>
                            <span class="divider"></span>
                            <span>${eCount} Exercises</span>
                            <span class="divider"></span>
                            <span>${nCount} Notes</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        fetchTopics();
    </script>
</body>
</html>
