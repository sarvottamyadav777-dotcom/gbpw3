<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <link rel="shortcut icon" href="https://i.ibb.co/Q3g9fGSt/1791541921524.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07070c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>Lecture Player — GB STUDY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.9/shaka-player.compiled.js"></script>
    <script>
      try {
        if (window.shaka && window.shaka.polyfill) window.shaka.polyfill.installAll();
        var p = new URLSearchParams(window.location.search);
        var b = p.get('batchId') || p.get('batch_id');
        var c = p.get('childId') || p.get('child_id') || p.get('videoId') || p.get('video_id');
        var s = p.get('subjectId') || p.get('subject_id') || 'all';
        var t = p.get('type') || (p.get('isLive') === 'true' ? 'live' : 'vod');
        if (!s || s === '[object Object]') s = 'all';
        if (b && c) {
          window.__PREFETCHED_TOKEN_KEY__ = b + ':' + c + ':' + s;
          window.__PREFETCHED_NOVEX_PROMISE__ = fetch('/api/novex-stream?batchId=' + encodeURIComponent(b) + '&subjectId=' + encodeURIComponent(s) + '&lectureId=' + encodeURIComponent(c), {
            headers: { 'Accept': 'application/json' },
            cache: 'no-store'
          }).catch(function() {
            return fetch('https://novexapi.ai.studio/api/stream-url?batchId=' + encodeURIComponent(b) + '&subjectId=' + encodeURIComponent(s) + '&lectureId=' + encodeURIComponent(c), {
              headers: { 'Accept': 'application/json' },
              cache: 'no-store'
            });
          }).then(function(res) { return res && res.ok ? res.json() : null; }).catch(function() { return null; });

          window.__PREFETCHED_DELTA_PROMISE__ = fetch('/api/resolve-delta-stream?batchId=' + encodeURIComponent(b) + '&subjectId=' + encodeURIComponent(s) + '&lectureId=' + encodeURIComponent(c) + '&videoId=' + encodeURIComponent(c) + '&scheduleId=' + encodeURIComponent(c) + '&type=' + encodeURIComponent(t) + '&t=' + Date.now(), {
            headers: { 'Accept': 'application/json' },
            cache: 'no-store'
          }).then(function(res) { return res.ok ? res.json() : null; }).catch(function() { return null; });

          window.__PREFETCHED_TOKEN_PROMISE__ = fetch('https://pw.eduzexstudy.workers.dev/token?batch_id=' + encodeURIComponent(b) + '&child_id=' + encodeURIComponent(c) + '&subject_id=' + encodeURIComponent(s), {
            headers: { 'Accept': 'application/json' },
            cache: 'no-store'
          }).then(function(res) {
            return res.ok ? res.json() : null;
          }).catch(function() { return null; });
        }
      } catch (e) {}
    </script>
  
<style>
  img[src*="1790916890122.png"], img[src*="eduzex.png"], .pw-header-logo, .footer-pw-logo, .brand img {
    border-radius: 50% !important;
    object-fit: cover !important;
  }
</style>
  <script type="module" crossorigin src="/assets/pw_player-BDsEtqCG.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/pw_player-D7_7tr3o.css">
</head>
  <body class="bg-[#07070c] text-white overflow-hidden">
    <div id="root">
      <div id="premount-loader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070b14;padding:16px;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased;">
        <!-- Top bar -->
        <div style="position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:12px 14px;background:linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);">
          <button onclick="history.back()" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          <div id="premount-top-title" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:600;color:#cbd5e1;">Lecture</div>
        </div>

        <!-- Centered Modal Card -->
        <div style="position:relative;width:100%;max-width:360px;border-radius:28px;border:1px solid rgba(56,189,248,0.25);background:#0d1424;padding:36px 24px 28px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,0.85), 0 0 45px rgba(56,189,248,0.12);">
          <!-- Animated rotating outer ring with glowing play circle -->
          <div style="position:relative;margin:0 auto;width:80px;height:80px;display:flex;align-items:center;justify-content:center;">
            <div style="position:absolute;inset:0;border-radius:50%;border:2.5px solid transparent;border-top-color:#38bdf8;border-right-color:#818cf8;animation:pwSpin 1.2s linear infinite;"></div>
            <div style="position:absolute;inset:4px;border-radius:50%;border:1px solid rgba(56,189,248,0.2);"></div>
            <div style="position:relative;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#2563eb,#38bdf8);display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(99,102,241,0.7);">
              <svg style="width:20px;height:20px;margin-left:2px;fill:#ffffff;" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </div>
          </div>

          <!-- Title / Status -->
          <h3 style="margin-top:20px;margin-bottom:0;font-size:17.5px;font-weight:800;letter-spacing:-0.02em;color:#ffffff;">
            Syncing Lecture Parameters...
          </h3>

          <!-- Lecture Name -->
          <p id="premount-lec-title" style="margin-top:6px;margin-bottom:0;padding:0 4px;font-size:13.5px;font-weight:500;line-height:1.5;color:#94a3b8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
            Loading lecture video...
          </p>

          <!-- Batch & Faculty Card -->
          <div style="margin-top:20px;margin-bottom:20px;display:flex;align-items:center;gap:14px;border-radius:16px;border:1px solid rgba(255,255,255,0.1);background:rgba(15,23,42,0.7);padding:12px;text-align:left;">
            <img id="premount-faculty-img" src="https://static.pw.live/5eb393ee95fab7468a79d189/ADMIN/a8a8837e-fa4d-4355-bbd5-214512154c23.png" alt="Faculty" style="width:44px;height:44px;flex-shrink:0;border-radius:12px;object-fit:cover;background:#1e293b;border:1px solid rgba(255,255,255,0.1);" />
            <div style="flex:1;min-width:0;">
              <div id="premount-batch-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px;font-weight:700;color:#ffffff;">
                Arjuna JEE 2026
              </div>
              <div id="premount-sub-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:600;color:#38bdf8;margin-top:2px;">
                Faculty • Lecture
              </div>
            </div>
          </div>

          <!-- Animated Gradient Progress Track -->
          <div style="height:4px;width:100%;overflow:hidden;border-radius:9999px;background:rgba(255,255,255,0.1);">
            <div style="height:100%;width:70%;border-radius:9999px;background:linear-gradient(to right, #38bdf8, #6366f1, #a855f7);animation:pwPulse 1.5s cubic-bezier(0.4,0,0.6,1) infinite;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes pwSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pwPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      </style>
      <script>
        (function() {
          try {
            var params = new URLSearchParams(window.location.search);
            var title = params.get('title') || params.get('topic') || params.get('name') || '';
            var batch = params.get('batch_name') || params.get('batchName') || localStorage.getItem('active_batch_name') || 'Arjuna JEE 2026';
            var teacher = params.get('teacher') || 'Faculty';
            var subject = params.get('subject') || 'Lecture';
            var img = params.get('image') || params.get('thumbnail') || '';

            if (title) {
              var topEl = document.getElementById('premount-top-title');
              var lecEl = document.getElementById('premount-lec-title');
              if (topEl) topEl.textContent = title;
              if (lecEl) lecEl.textContent = title;
            }
            if (batch) {
              var bEl = document.getElementById('premount-batch-name');
              if (bEl) bEl.textContent = batch;
            }
            var subEl = document.getElementById('premount-sub-name');
            if (subEl) {
              subEl.textContent = teacher + ' • ' + subject;
            }
            if (img) {
              var imgEl = document.getElementById('premount-faculty-img');
              if (imgEl) imgEl.src = img;
            }
          } catch(e){}
        })();
      </script>
    </div>
  </body>
</html>
